  .pres-dl svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;

  .pdf-frame { width: 100%; height: calc(100vh - 170px); min-height: 500px; border: 1px solid var(--sand-500);

  .pres-note { font-size: 12.5px; color: var(--taupe); margin-top: 12px; }
